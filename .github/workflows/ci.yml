name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install shell test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - run: cargo fmt --check --manifest-path editor/Cargo.toml
      - run: cargo clippy --manifest-path editor/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path editor/Cargo.toml
      - run: bats tests
      - run: shellcheck install.sh shell/specific.sh bin/*
